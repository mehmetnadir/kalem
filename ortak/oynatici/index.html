<!doctype html>
<html lang="tr" data-tema="acik"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ders oynatıcısı — prototip</title>
<link rel="stylesheet" href="kalem-oynatici.css">
<style>
/* Sayfa: ydspublishing.com/grammar/<video> taslağı. Beyaz zemin, Lexend, YDS lacivert + sarı
   (logo renkleri). Oynatıcı kromu kalem-oynatici.css'te; burası yalnız sayfa iskeleti. */
:root{--zemin:#fff;--yuzey:#f4f5f9;--cizgi:#e2e5ee;--metin:#13204D;--ikincil:#5a6275;
  --vurgu:#13204D;--sari:#fece00;--odak:#1D3FA8;--kart:#fff;
  --golge:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.07)}
:root[data-tema=koyu]{--zemin:#0f1320;--yuzey:#171c2c;--cizgi:#272e45;--metin:#f3efe6;
  --ikincil:#aab0c2;--vurgu:#fece00;--kart:#171c2c;--golge:0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--zemin);color:var(--metin);
  font:500 16px/1.5 Lexend,system-ui,sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit}
button{font:inherit}
:focus-visible{outline:2px solid var(--odak);outline-offset:2px}
:root[data-tema=koyu] :focus-visible{outline-color:var(--sari)}
.ust{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px;
  padding:0 20px;max-width:1280px;margin:0 auto}
.ust img{height:30px;display:block}
.ust nav{font-size:14px;color:var(--ikincil);display:flex;gap:8px;align-items:center;
  white-space:nowrap;overflow:hidden}
.ust nav a{text-decoration:none}
.ust nav a:hover{text-decoration:underline}
.ust nav b{color:var(--metin);overflow:hidden;text-overflow:ellipsis}
main{max-width:1280px;margin:0 auto;padding:0 20px 56px;display:grid;
  grid-template-columns:minmax(0,1fr) 360px;gap:12px 32px;align-items:start}
main.dikey{grid-template-columns:minmax(0,440px) minmax(0,1fr);grid-template-rows:auto 1fr}
.oynatici{min-width:0;grid-column:1}
main.dikey .oynatici{grid-row:1 / span 2;justify-self:center;
  width:min(100%,calc(82vh * (var(--ar,9 / 16))))}
.baslik{grid-column:1}
main.dikey .baslik{grid-column:2;grid-row:1}
.baslik h1{font-size:26px;line-height:1.2;margin:14px 0 8px;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;color:var(--ikincil);
  font-size:14px}
.rozet{background:var(--yuzey);border:1px solid var(--cizgi);border-radius:999px;padding:2px 11px;
  font-size:13px;color:var(--metin)}
.rozet.sari{background:var(--sari);border-color:var(--sari);color:#13204D;font-weight:700}
.amac{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:8px;color:var(--metin)}
.amac li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.amac li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--sari);
  margin-top:8px}
.bolumler{grid-column:2;grid-row:1 / span 2;position:sticky;top:16px}
main.dikey .bolumler{grid-column:2;grid-row:2;position:static;align-self:start}
.bolumler h2{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--ikincil);
  margin:14px 0 8px}
.bl{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 12px;
  margin:0 0 6px;border:0;border-radius:12px;background:var(--kart);color:inherit;text-align:left;
  cursor:pointer;box-shadow:inset 0 0 0 1px var(--cizgi);transition:transform .12s,box-shadow .12s}
.bl:hover{transform:translateY(-1px);box-shadow:inset 0 0 0 1px var(--cizgi),var(--golge)}
.bl .no{flex:none;width:30px;height:30px;border-radius:8px;background:var(--yuzey);
  display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.bl .ad{flex:1;min-width:0;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.bl .zm{color:var(--ikincil);font-size:13px;font-variant-numeric:tabular-nums}
.bl.on{box-shadow:inset 0 0 0 2px var(--sari)}
.bl.on .no{background:var(--sari);color:#13204D}
.gezin{display:none;grid-column:1;align-items:center;gap:8px;margin:8px 0 0}
.gezin button{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;
  padding:0 14px;border:1px solid var(--cizgi);border-radius:10px;background:var(--kart);
  color:inherit;cursor:pointer}
.gezin button:disabled{opacity:.4;cursor:default}
.gezin button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.gezin .simdi{flex:1;text-align:center;font-weight:700;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.gezin .simdi small{display:block;font-weight:500;font-size:12px;color:var(--ikincil)}
.not{grid-column:1 / -1;margin-top:28px;padding-top:14px;border-top:1px solid var(--cizgi);
  font-size:13px;color:var(--ikincil)}
.not kbd{font:inherit;background:var(--yuzey);border:1px solid var(--cizgi);border-radius:4px;
  padding:0 5px}
@media (max-width:960px){
  main,main.dikey{grid-template-columns:1fr;grid-template-rows:none}
  .bolumler,main.dikey .bolumler,main.dikey .baslik,main.dikey .oynatici{grid-column:1;
    grid-row:auto}
  .bolumler,main.dikey .bolumler{position:static}   /* .oynatici = .ko: relative kalmalı */
  main.dikey .oynatici{width:min(100%,calc(70vh * (var(--ar,9 / 16))))}
  .gezin{display:flex}
}
@media (max-width:560px){
  .ust{height:56px;padding:0 16px}
  .ust img{height:24px}
  .ust nav{display:none}
  main{padding:0 0 40px}
  .baslik,.bolumler,.gezin,.not{padding-left:16px;padding-right:16px}
  .baslik h1{font-size:21px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:0s !important}}
</style>
</head><body>
<header class="ust">
  <a href="#" aria-label="YDS Publishing"><img id="logo" alt="YDS Publishing"
    src="/projeler/present-continuous/ortak/logo/yds-publishing-lacivert.svg"></a>
  <nav aria-label="Konum"><a href="#">Grammar</a><span aria-hidden="true">›</span>
    <b id="kirinti"></b></nav>
</header>
<main id="ana">
  <div class="oynatici" id="oynatici"></div>
  <div class="gezin" id="gezin">
    <button type="button" id="onceki" aria-label="Önceki bölüm"><svg viewBox="0 0 24 24"
      aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="simdi"><span id="gezinAd">—</span><small id="gezinNo"></small></div>
    <button type="button" id="sonraki" aria-label="Sonraki bölüm"><svg viewBox="0 0 24 24"
      aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
  <section class="baslik">
    <h1 id="baslik">Ders yükleniyor</h1>
    <div class="meta" id="meta"></div>
    <ul class="amac" id="amac"></ul>
  </section>
  <aside class="bolumler" aria-label="Bölümler"><h2>Bölümler</h2><div id="liste"></div></aside>
  <p class="not">Prototip 0.1 · klavye: <kbd>Boşluk</kbd> oynat · <kbd>J</kbd>/<kbd>L</kbd> 10 sn ·
    <kbd>←</kbd>/<kbd>→</kbd> 5 sn · <kbd>[</kbd>/<kbd>]</kbd> bölüm · <kbd>C</kbd> altyazı ·
    <kbd>F</kbd> tam ekran · <kbd>T</kbd> tema · <kbd>M</kbd> sessiz</p>
</main>
<script type="module">
import { monte } from "./kalem-oynatici.js";
const Q = new URLSearchParams(location.search), PAKET = Q.get("paket") || "present-perfect-temel";
const YOL = "/projeler/" + PAKET + "/";
const $ = (s) => document.querySelector(s);
const kokPaket = PAKET.replace(/-(dikey|s1|d1)$/, "");      // meta ana paketten (aynı video)
const temaIlk = Q.get("tema") || null;
const LOGO = { acik: "yds-publishing-lacivert.svg", koyu: "yds-publishing-koyu-zemin.svg" };
function sayfaTema(t) {
  document.documentElement.dataset.tema = t; $("#logo").src = YOL + "ortak/logo/" + LOGO[t];
}
sayfaTema(temaIlk || "acik");
(function fontKur() {                                        // Lexend paketin kendi dizininden
  const st = document.createElement("style");
  st.textContent = [500, 700].map((w) => "@font-face{font-family:Lexend;font-weight:" + w +
    ";font-display:swap;src:url(" + YOL + "ortak/font/lexend-latin-" + w +
    "-normal.woff2) format('woff2')}").join("");
  document.head.appendChild(st);
})();
let B = [], aktif = -1, api = null;
function mmss(x) {
  x = Math.max(0, Math.floor(x));
  return Math.floor(x / 60) + ":" + (x % 60 < 10 ? "0" : "") + x % 60;
}
function listeCiz() {
  const k = $("#liste"); k.innerHTML = "";
  B.forEach((b, i) => {
    const x = document.createElement("button"); x.type = "button";
    x.className = "bl" + (i === aktif ? " on" : "");
    x.innerHTML = "<span class='no'>" + (i + 1) + "</span><span class='ad'></span>" +
      "<span class='zm'></span>";
    x.querySelector(".ad").textContent = b.ad; x.querySelector(".zm").textContent = mmss(b.t0);
    x.setAttribute("aria-current", i === aktif ? "true" : "false");
    x.onclick = () => { api.bolumGit(i); api.oyna(); }; k.appendChild(x);
  });
  $("#gezinAd").textContent = B[aktif] ? B[aktif].ad : "—";
  $("#gezinNo").textContent = B.length ? "Bölüm " + (aktif + 1) + " / " + B.length : "";
  $("#onceki").disabled = aktif <= 0; $("#sonraki").disabled = aktif >= B.length - 1;
}
function rozet(t, cls) {
  const e = document.createElement("span"); e.className = "rozet" + (cls ? " " + cls : "");
  e.textContent = t; $("#meta").appendChild(e);
}
fetch("/projeler/" + kokPaket + "/surumler.json").then((r) => (r.ok ? r.json() : {}))
  .catch(() => ({})).then((s) => {
    const v = (s && s.video) || {}, ad = v.konu || PAKET;
    document.title = ad + " — ders oynatıcısı";
    $("#baslik").textContent = ad; $("#kirinti").textContent = ad;
    if (v.kitle) rozet(v.kitle, "sari");
    if (v.seviye) rozet(v.seviye[0].toUpperCase() + v.seviye.slice(1));
    if (v.ders) rozet(v.ders);
    if (/-dikey$/.test(PAKET)) rozet("Dikey 9:16");
    const sure = document.createElement("span"); sure.id = "sure"; $("#meta").appendChild(sure);
    (v.canAlici || []).slice(0, 4).forEach((t) => {
      const li = document.createElement("li"); li.textContent = t; $("#amac").appendChild(li);
    });
    api = monte($("#oynatici"), {
      paket: YOL, tema: temaIlk, baslik: ad, alt: [v.kitle, v.seviye].filter(Boolean).join(" · "),
      olay(tur, d) {
        if (tur === "hazir") {
          B = d.bolumler; listeCiz();
          $("#sure").textContent = mmss(d.sure) + " · " + B.length + " bölüm";
          $("#ana").classList.toggle("dikey", api.kok.dataset.yon === "dikey");
          $("#ana").style.setProperty("--ar", api.kok.style.getPropertyValue("--ar"));
        } else if (tur === "bolum") { aktif = d.no; listeCiz(); }
        else if (tur === "tema") sayfaTema(d.tema);
      },
    });
    $("#onceki").onclick = () => api.bolumGit(aktif - 1);
    $("#sonraki").onclick = () => api.bolumGit(aktif + 1);
    window.OYNATICI = api;                                    // kare denetimi ve deneme için
    const depo = (() => { try { return JSON.parse(localStorage.getItem("kalem.oynatici.tema")); }
      catch (e) { return null; /* depo kapalı */ } })();
    if (!temaIlk && depo) sayfaTema(depo);
  });
</script>
</body></html>
